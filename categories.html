<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | FreshMart</title>
<link rel="stylesheet" href="css/style.css">
<style>
.category-container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 0 20px;
}

.category-container h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
}

.category-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.category-card {
    flex: 1 1 200px;
    max-width: 200px;
    background: #27ae60;
    color: white;
    text-align: center;
    padding: 40px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.category-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.filtered-products {
    margin-top: 50px;
}

.product-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.product-card {
    flex: 1 1 200px;
    max-width: 200px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 15px;
    text-align: center;
}

.product-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
}

.product-card button {
    margin-top: 10px;
    padding: 5px 10px;
    border: none;
    background: #27ae60;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">Fresh<span>Mart</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
    </nav>
</header>

<!-- CATEGORIES SECTION -->
<section class="category-container">
    <h2>Shop by Category</h2>
    <div class="category-grid" id="categoryGrid">
        <!-- Categories dynamically rendered -->
    </div>

    <!-- Filtered Products -->
    <div class="filtered-products">
        <h2 id="filteredTitle"></h2>
        <div class="product-grid" id="filteredProducts"></div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <div class="footer-content">
        <div class="footer-section">
            <h3>FreshMart</h3>
            <p>Delivering fresh groceries to your home since 2026.</p>
        </div>
        <div class="footer-section">
            <h3>Quick Links</h3>
            <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
        </div>
        <div class="footer-section">
            <h3>Contact</h3>
            <p>Email: support@freshmart.com</p>
            <p>Phone: +1 234 567 890</p>
        </div>
    </div>
    <p class="footer-bottom">© 2026 FreshMart. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
// Categories data
const categories = [
    { name: "Fruits", ids: [1,2] },
    { name: "Dairy", ids: [3] },
    { name: "Bakery", ids: [4] },
    { name: "Beverages", ids: [5] },
    { name: "Eggs & More", ids: [6] }
];

// Render category cards
const categoryGrid = document.getElementById("categoryGrid");
categories.forEach(cat => {
    const div = document.createElement("div");
    div.className = "category-card";
    div.innerText = cat.name;
    div.onclick = () => filterCategory(cat);
    categoryGrid.appendChild(div);
});

// Filter products by category
function filterCategory(category){
    const filteredTitle = document.getElementById("filteredTitle");
    const filteredProducts = document.getElementById("filteredProducts");
    filteredTitle.innerText = category.name;
    filteredProducts.innerHTML = "";

    const filtered = products.filter(p => category.ids.includes(p.id));
    filtered.forEach(item => {
        filteredProducts.innerHTML += `
            <div class="product-card">
                <img src="${item.image}" alt="${item.name}">
                <h3>${item.name}</h3>
                <p>$${item.price}</p>
                <button onclick="addToCart(${item.id})">Add to Cart</button>
            </div>
        `;
    });
}

// Update cart count
updateCartCount();
</script>

</body>
</html>
