<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | FreshMart</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Cart page styling */
.cart-container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 0 20px;
}

.cart-container h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
}

.cart-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border-radius: 10px;
    overflow: hidden;
}

.cart-table th, .cart-table td {
    padding: 15px;
    text-align: center;
}

.cart-table th {
    background: #27ae60;
    color: white;
}

.cart-table td img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
}

.cart-table td button {
    padding: 5px 10px;
    border: none;
    background: #e74c3c;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

.cart-table td input {
    width: 50px;
    padding: 5px;
    text-align: center;
}

.cart-total {
    text-align: right;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

.empty-cart {
    text-align: center;
    font-size: 20px;
    margin-top: 50px;
    color: #555;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">Fresh<span>Mart</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
    </nav>
</header>

<!-- CART SECTION -->
<section class="cart-container">
    <h2>Your Cart</h2>
    <div id="cartContent"></div>
</section>

<!-- FOOTER -->
<footer>
    <div class="footer-content">
        <div class="footer-section">
            <h3>FreshMart</h3>
            <p>Delivering fresh groceries to your home since 2026.</p>
        </div>
        <div class="footer-section">
            <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
        </div>
        <div class="footer-section">
            <h3>Contact</h3>
            <p>Email: support@freshmart.com</p>
            <p>Phone: +1 234 567 890</p>
        </div>
    </div>
    <p class="footer-bottom">© 2026 FreshMart. All Rights Reserved.</p>
</footer>

<!-- JS -->
<script src="js/app.js"></script>
<script>
// Cart rendering
const cartContent = document.getElementById("cartContent");
updateCartCount();

function renderCart() {
    if(cart.length === 0){
        cartContent.innerHTML = '<p class="empty-cart">Your cart is empty.</p>';
        return;
    }

    let total = 0;
    let tableHTML = `
        <table class="cart-table">
            <tr>
                <th>Product</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
    `;

    cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;
        tableHTML += `
            <tr>
                <td><img src="${item.image}" alt="${item.name}"></td>
                <td>${item.name}</td>
                <td>$${item.price}</td>
                <td>
                    <input type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${item.id}, this.value)">
                </td>
                <td>$${subtotal}</td>
                <td><button onclick="removeFromCart(${item.id})">Remove</button></td>
            </tr>
        `;
    });

    tableHTML += `</table>`;
    tableHTML += `<p class="cart-total">Total: $${total}</p>`;
    cartContent.innerHTML = tableHTML;
}

// Initial render
renderCart();
</script>

</body>
</html>
